version: '3.9'

# This file is for LOCAL DEVELOPMENT ONLY.
# It creates a self-contained environment with a server, database, cache, and storage.
# Production variables (like your Railway DB URL) are set in the Railway dashboard, not here.

services:
  # This service builds and runs your application from the Dockerfile
  server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      # These variables are passed into the 'server' container.
      # They point to the OTHER services defined in this file.
      - NODE_ENV=development
      - DB_URL=mongodb://mongo:27017/lms
      - REDIS_URL=redis://redis:6379
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadminsecret
      - MINIO_USE_SSL=false
      # You MUST add your other required .env variables here
      - REFRESH_TOKEN_EXPIRE=30
      - ACCESS_TOKEN_EXPIRE=15
      - ACTIVATION_SECRET=YourActivationSecret
      - REFRESH_TOKEN=YourRefreshTokenSecret
      - ACCESS_TOKEN=YourAccessTokenSecret
      - RESEND_API_KEY=YourResendApiKey
      - RESEND_SENDER_EMAIL=YourResendSenderEmail
      - STRIPE_PUBLISHABLE_KEY=YourStripePublishableKey
      - STRIPE_SECRET_KEY=YourStripeSecretKey
      - ORIGIN=['http://localhost:3000']
    depends_on:
      - mongo
      - minio
      - redis
    restart: unless-stopped

  # This is your LOCAL MongoDB database service
  mongo:
    image: mongo:latest
    environment:
      MONGO_INITDB_DATABASE: lms
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"

  # This is your LOCAL MinIO object storage service
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadminsecret
    ports:
      - "9000:9000"   # API Port
      - "9001:9001"   # Web Console Port
    volumes:
      - minio_data:/data

  # This is your LOCAL Redis cache service
  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

# These named volumes persist your data locally between docker-compose runs
volumes:
  mongo_data:
  minio_data:
  redis_data: