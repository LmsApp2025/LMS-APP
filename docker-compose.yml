# In: LMS-APP/docker-compose.yml (For Production & Building)

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      # In production (like Railway), these are placeholders. The platform injects the real values.
      # When running with this file, it uses these values to connect to the other containers.
      - DB_URL=mongodb://mongo:27017/lms
      - REDIS_URL=redis://redis:6379
      - MINIO_ENDPOINT=minio
      # NOTE: All other secrets (JWT, Resend, Stripe, etc.) must be provided when running.
    depends_on:
      - mongo
      - minio
      - redis
    restart: unless-stopped

  mongo:
    image: mongo:latest
    environment:
      - MONGO_INITDB_DATABASE=lms
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadminsecret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mongo_data:
  minio_data:
  redis_data: